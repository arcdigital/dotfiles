name: Check dotfiles
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zsh shellcheck python3-venv
      - run: python3 -m venv /tmp/dotfiles-test-venv && /tmp/dotfiles-test-venv/bin/pip install "dotbot>=1.24"
      - run: shellcheck -x install.sh install-container.sh bin/* scripts/*.sh scripts/prepare-links scripts/git-prune scripts/install-container-tools scripts/macos-preferences
      - run: DOTBOT_BIN=/tmp/dotfiles-test-venv/bin/dotbot PYTHONDONTWRITEBYTECODE=1 python3 tests/run.py
  containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:12']
        platform: ['linux/amd64', 'linux/arm64']
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - run: docker build --platform '${{ matrix.platform }}' --build-arg BASE_IMAGE='${{ matrix.image }}' -f tests/Dockerfile -t dotfiles-check .
      - run: docker run --rm --platform '${{ matrix.platform }}' dotfiles-check
